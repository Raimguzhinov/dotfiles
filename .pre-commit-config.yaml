# commit-msg и pre-push хуки требуют отдельной установки: pre-commit install -t commit-msg -t pre-push
repos:
  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt
        entry: nixfmt --check
        language: system
        types: [nix]
      - id: pi-theme-tokens
        name: pi theme tokens
        entry: python3 scripts/check_pi_theme_tokens.py
        language: system
        files: 'nixos/modules/features/pi\.nix'
      - id: commit-msg
        name: commit-msg format
        entry: bash scripts/check_commit_msg.sh
        language: system
        stages: [commit-msg]
      - id: nix-flake-check
        name: nix flake check
        entry: nix flake check ./nixos
        language: system
        files: '^nixos/'
        pass_filenames: false
        stages: [pre-push]
